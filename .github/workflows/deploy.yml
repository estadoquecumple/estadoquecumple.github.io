name: Deploy Astro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-data.txt
            requirements-platform-core-free.txt
      - name: Install free data validation platform
        run: |
          "$pythonLocation/bin/python" -m pip install -r requirements-data.txt
          "$pythonLocation/bin/python" -m pip install -r requirements-platform-core-free.txt
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run validate
      - run: npm run lab:e2e
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-data.txt
            requirements-platform-core-free.txt
      - name: Install free build dependencies
        run: |
          "$pythonLocation/bin/python" -m pip install -r requirements-data.txt
          "$pythonLocation/bin/python" -m pip install -r requirements-platform-core-free.txt
      - run: npm ci
      - name: Stamp the publication commit in foundation-v4.json
        run: npm run data:v4
        env:
          GITHUB_SHA: ${{ github.sha }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Refresh territorial data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 2'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: pip install -r requirements-data.txt
      - run: npm ci
      - run: npm run data:refresh
      - run: npm run validate
      - run: tar -czf territorial-data-refresh.tar.gz public/data/territorial data/sources.yml
      - uses: actions/upload-artifact@v4
        with:
          name: territorial-data-refresh-${{ github.run_id }}
          path: |
            territorial-data-refresh.tar.gz
            public/data/territorial/manifest.json
          retention-days: 14
